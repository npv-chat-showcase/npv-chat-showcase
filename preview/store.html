<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NpV Chat Showcase — store screenshots</title>
<link rel="stylesheet" href="../extension/chat.css">
<!-- Store screenshots (1280x800): store.html (chat + viewer card) and store.html?view=tiers. Made-up chatter names. -->
<style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:800px;overflow:hidden;background:#0e0e10;color:#efeff1;font:13px/20px Inter,Roobert,"Segoe UI",Arial,sans-serif}
.stage{position:absolute;inset:0 380px 0 0;padding:64px 60px;background:radial-gradient(circle at 30% 20%,#3b1d5e 0,#16121f 55%,#0e0e10 100%)}
.stage h1{font-size:44px;line-height:1.1;margin:0 0 18px;max-width:640px}.stage h1 em{font-style:normal;color:#ff4081}
.stage p{font-size:19px;line-height:1.5;color:#c8c8d0;max-width:560px;margin:0 0 26px}
.points{list-style:none;padding:0;margin:0;display:grid;gap:14px;font-size:17px;color:#e6e6ea;max-width:560px}
.points li{display:flex;gap:12px;align-items:center}.points .npv-showcase-badge{transform:scale(1.35);margin:0 8px 0 4px}
.chat{position:absolute;top:0;right:0;bottom:0;width:380px;background:#18181b;border-left:1px solid #2f2f35;padding:10px 0;overflow:hidden}
.chat h2{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#adadb8;margin:0 16px 8px;padding-bottom:8px;border-bottom:1px solid #2f2f35}
.line{padding:5px 16px}.b{display:inline-block;width:18px;height:18px;border-radius:3px;vertical-align:middle;margin-right:3px}
.chat-line__username{font-weight:700;cursor:pointer}
.viewer-card{position:absolute;right:410px;top:380px;width:340px;background:#1f1f23;border:1px solid #3a3a40;border-radius:6px;overflow:hidden;box-shadow:0 18px 50px #000a}
.viewer-card .head{display:flex;gap:12px;align-items:center;padding:16px;background:linear-gradient(120deg,#2b145a,#1f1f23)}
.avatar{width:54px;height:54px;border-radius:50%;background:#ff4081;display:grid;place-items:center;font-size:24px;font-weight:700}
.viewer-card a{color:#efeff1;font-size:17px;font-weight:700;text-decoration:none}.meta{color:#adadb8;font-size:12px}
.viewer-card .npv-showcase-panel{margin:0}
.tiers{position:absolute;inset:0;padding:0 70px;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 70% 10%,#3b1d5e 0,#16121f 55%,#0e0e10 100%)}
.tiers h1{font-size:48px;margin:0 0 16px}.tiers>p{font-size:21px;color:#c8c8d0;margin:0 0 44px;max-width:1000px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.tier{background:#18181bdd;border:1px solid #34343a;border-radius:14px;padding:34px 26px 38px;min-height:290px}
.tier .npv-showcase-badge{transform:scale(3);transform-origin:left center;margin:14px 0 42px 4px}
.tier h3{margin:0 0 12px;font-size:28px}.tier p{margin:0;color:#c8c8d0;font-size:18px;line-height:1.55}
.tiers .note{margin:34px 0 0;color:#adadb8;font-size:16px}
</style></head><body>
<script>
const CDN='https://nopixel-v-companion-cdn.com/cards/';
const card=(name,file,edition,printNumber)=>({id:name+printNumber,cardId:name,name,edition,printNumber:String(printNumber),
  editionName:{normal:'Base',legendary:'Foil',gold:'Gold'}[edition],image:CDN+file,ultraRare:false});
const displays={
  pack_ripper:[card('Blau','Blau_Gold.webp','gold',12),card('koil','koil_front.webp','legendary',8),card('Omie','Omie.webp','normal',93)],
  goldtony_fan:[card('Blau','Blau_Gold.webp','gold',1),card('Omie','Omie.webp','normal',93),card('koil','koil_front.webp','legendary',15)],
  cypress_kid:[card('Omie','Omie_Gold.webp','gold',70),card('koil','koil_front.webp','legendary',240),card('Blau','Blau.webp','normal',500)],
  vespucci_val:[card('Omie','Omie.webp','legendary',300),card('Blau','Blau.webp','legendary',410),card('koil','koil_front.webp','legendary',380)],
  grinder_gus:[card('koil','koil_front.webp','normal',4100),card('Omie','Omie.webp','normal',6200)],
  bennys_mech:[card('Blau','Blau.webp','normal',2800)]
};
const chatters=[['grinder_gus','#ff7f50','who got the grinder?'],['cypress_kid','#9acd32','that heist was clean'],['quiet_lurker','#5f9ea0','first time catching this live'],
  ['vespucci_val','#1e90ff','foil pulls today 👀'],['bennys_mech','#d2691e','car still in the shop lmao'],['pack_ripper','#ff69b4','opened 3 packs, finally a gold'],
  ['goldtony_fan','#daa520','I NEED GOLD TONY CARD'],['quiet_lurker','#5f9ea0','how do the badges work?'],['cypress_kid','#9acd32','click a name to see their cards'],
  ['grinder_gus','#ff7f50','999'],['vespucci_val','#1e90ff','gold #1 in chat??'],['pack_ripper','#ff69b4','GG']];
const line=([name,color,text])=>`<div class="line"><span class="b" style="background:#9146ff"></span><span class="chat-line__username-container"><span class="chat-line__username" role="button"><span data-a-target="chat-message-username" data-a-user="${name}" style="color:${color}">${name}</span></span></span>: ${text}</div>`;
const view=new URLSearchParams(location.search).get('view');
if(view==='promo'){
  document.body.innerHTML=`<section style="position:absolute;inset:0;width:440px;height:280px;display:flex;align-items:center;gap:22px;padding:0 30px;background:radial-gradient(circle at 25% 30%,#4a2178 0,#1b1426 60%,#0e0e10 100%)">
  <img src="../extension/icons/icon-128.png" width="112" height="112" alt="">
  <div><div style="font-size:30px;font-weight:800;line-height:1.1">NpV Chat<br>Showcase</div>
  <div style="margin-top:10px;font-size:15px;line-height:1.4;color:#d6d6de">NoPixel card tiers<br>in Twitch chat</div></div></section>`;
} else if(view==='tiers'){
  document.body.innerHTML=`<section class="tiers"><h1>Every display case gets a tier</h1>
  <p>Print numbers count copies in pull order, so low numbers are scarce. Each card scores by its print number and edition (Gold, Foil, Base), the lowest prints (#1–#3) get an extra boost, and the three cards add up to the display's tier.</p>
  <div class="grid">${[['common','Common','Most displays. Base cards with higher print numbers.'],['rare','Rare','About 1 in 5. Foils, or Base cards in the first thousand.'],
  ['epic','Epic','About 1 in 16. Strong Golds, or a single #1 or Gold #2.'],['legendary','Legendary','About 1 in 160. A #1 print backed by strong cards, or three very low Golds.']]
  .map(([tier,title,text])=>`<div class="tier"><span class="npv-showcase-badge" data-tier="${tier}" data-icon="${tier}"></span><h3>${title}</h3><p>${text}</p></div>`).join('')}</div>
  <p class="note">Shares measured from 320 display cases seen in NoPixel chats, October 2026.</p></section>
  <aside class="chat" style="opacity:0">${chatters.filter(([name])=>['goldtony_fan','pack_ripper','vespucci_val','grinder_gus'].includes(name)).map(line).join('')}</aside>`;
} else {
  document.body.innerHTML=`<section class="stage"><h1>See who's holding <em>NoPixel cards</em>, right in Twitch chat</h1>
  <p>Tier badges for every chatter's NoPixel V Companion display case. Click a name to see their cards.</p>
  <ul class="points"><li><span class="npv-showcase-badge" data-icon="legendary" data-tier="legendary"></span>Rates the whole display: edition, print number, sets</li>
  <li><span class="npv-showcase-badge" data-icon="epic" data-tier="epic"></span>Works with Twitch chat and 7TV</li>
  <li><span class="npv-showcase-badge" data-icon="rare" data-tier="rare"></span>Saved badges load instantly next time</li></ul></section>
  <aside class="chat"><h2>Stream chat</h2>${chatters.map(line).join('')}</aside>
  <section class="viewer-card"><div class="head"><div class="avatar">P</div><div><a href="https://www.twitch.tv/pack_ripper">pack_ripper</a><div class="meta">Following since March 2024</div></div></div></section>`;
}
window.chrome={runtime:{getManifest:()=>({version:'1.0.0'}),onMessage:{addListener(){}},
  sendMessage:async m=>m.type==='npv:status'?{ready:true}:{ok:true,value:{login:m.login,cards:displays[m.login]||[]}}}};
</script>
<script src="../extension/core.js"></script><script src="../extension/chat.js"></script>
<script>
// Static badges in the marketing copy use the same icon drawing as the chat (copied from a live chat badge).
const fill=()=>{const live={};document.querySelectorAll('.chat .npv-showcase-badge').forEach(b=>live[b.dataset.tier]=b);
  document.querySelectorAll('[data-icon]').forEach(b=>{if(!b.firstChild&&live[b.dataset.icon])b.append(live[b.dataset.icon].firstChild.cloneNode(true))});};
setInterval(fill,500);
</script>
</body></html>
